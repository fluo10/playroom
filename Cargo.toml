[package]
name = "playroom"
version = "0.1.0"
edition = "2021"

[dependencies]
iroh = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
bytes = "1"

[workspace]
members = [
    "crates/playtable-core",
    "crates/playtable-server",
    "crates/playtable",
]
resolver = "2"

[workspace.dependencies]
# Transport
iroh = "0.97"

# Serialization
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# GUI
bevy = "0.18"

# MCP
rmcp = { version = "1.2", features = ["server", "transport-io"] }

# Utilities
rand = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
dirs = "6"
hex = "0.4"

# Internal
playroom = { path = "." }
playtable-core = { path = "crates/playtable-core" }
